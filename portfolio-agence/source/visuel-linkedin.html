<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; } body { margin: 0; }
  .v { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #010a2e; color: #fff; font-family: Inter, sans-serif; padding: 76px 80px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 72px 72px; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); }
  h1 { font-family: 'Plus Jakarta Sans'; font-weight: 800; letter-spacing: -.045em; line-height: 1; margin: 0; font-size: 104px; }
  .g { background: linear-gradient(135deg, #01daff, #0b58ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .k { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 22px; letter-spacing: .22em; text-transform: uppercase; color: #01daff; display: flex; align-items: center; gap: 14px; }
  .k::before { content: ''; width: 40px; height: 4px; border-radius: 4px; background: linear-gradient(135deg, #01daff, #0b58ff); }
  .shot { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 40px 90px rgba(0,0,0,.55); }
  .shot .bar { height: 24px; background: #e9edf5; display: flex; gap: 7px; align-items: center; padding: 0 12px; } .shot .bar i { width: 9px; height: 9px; border-radius: 50%; background: #c3cbdb; display: block; }
  img { display: block; }
</style>
</head>
<body>
<section class="v">
  <div class="grid"></div>
  <div class="orb" style="width:760px; height:760px; right:-260px; top:380px; background:#0b58ff; opacity:.6"></div>
  <div class="orb" style="width:480px; height:480px; left:-200px; bottom:-200px; background:#01daff; opacity:.35"></div>

  <div style="position:relative; display:flex; align-items:center; gap:16px">
    <img src="a/edust-icon.svg" style="width:58px; height:58px">
    <div style="line-height:1"><p style="margin:0; font-family:'Plus Jakarta Sans'; font-weight:800; font-size:26px; letter-spacing:.08em">E-DUST</p><p style="margin:7px 0 0; font-family:'Plus Jakarta Sans'; font-weight:700; font-size:13px; letter-spacing:.42em; color:#01daff">SOLUTIONS</p></div>
  </div>

  <div style="position:relative; margin-top:64px">
    <p class="k" style="margin:0">Étude de cas · Création complète</p>
    <h1 style="margin-top:28px">Une marque de burgers, <span class="g">de zéro.</span></h1>
    <p style="margin:26px 0 0; font-size:28px; line-height:1.45; color:#b4c0e0; max-width:820px">Logo, photos, site de commande, réseaux sociaux et print. L’étude de cas complète en images 👇</p>
  </div>

  <!-- collage -->
  <div style="position:absolute; left:0; right:0; top:700px; height:560px">
    <div style="position:absolute; left:70px; top:40px; width:250px; height:250px; border-radius:40px; background:#ffc22b; display:grid; place-items:center; transform:rotate(-7deg); box-shadow:0 40px 90px rgba(0,0,0,.5); z-index:3"><img src="a/smashhouse-logo-badge.svg" style="width:206px"></div>
    <div class="shot" style="position:absolute; left:230px; top:70px; width:640px; transform:rotate(2deg); z-index:2"><div class="bar"><i></i><i></i><i></i></div><img src="a/ff-home.jpg" style="width:100%"></div>
    <img src="a/01.jpg" style="position:absolute; left:780px; top:-30px; width:250px; border-radius:18px; transform:rotate(8deg); box-shadow:0 40px 90px rgba(0,0,0,.5); z-index:4">
    <div style="position:absolute; left:110px; top:330px; width:200px; height:200px; border-radius:50%; overflow:hidden; border:6px solid rgba(255,255,255,.12); box-shadow:0 30px 70px rgba(0,0,0,.5); z-index:4"><img src="a/bacon-bbq.jpg" style="width:100%; height:100%; object-fit:cover"></div>
  </div>

  <div style="position:absolute; left:80px; right:80px; bottom:56px; display:flex; justify-content:space-between; font-size:20px; font-weight:600; color:#7d8fc4; z-index:5">
    <span>Agence marketing &amp; création digitale</span><span>SMASH HOUSE : projet de démonstration</span>
  </div>
</section>
</body>
</html>
