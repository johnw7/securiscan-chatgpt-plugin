name: NOAMIS brouillon quotidien

on:
  schedule:
    - cron: "17 6 * * 1-5"   # du lundi au vendredi, 06:17 UTC (7h17 ou 8h17 à Paris)
  workflow_dispatch: {}        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le brouillon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ok=1; for m in gemini-flash-latest gemini-flash-lite-latest gemini-flash-latest; do GEMINI_MODEL=$m python noamis-daily/daily_draft.py && ok=0 && break; sleep 30; done; exit $ok
