name: NOAMIS brouillon quotidien

on:
  schedule:
    - cron: "17 6 * * 1-5"   # du lundi au vendredi, 06:17 UTC (7h17 ou 8h17 à Paris)
  workflow_dispatch: {}        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le brouillon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python noamis-daily/daily_draft.py
