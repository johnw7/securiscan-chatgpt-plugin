<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Miniature de la vidéo « Le permis vélo » 1080×1920 */
  :root { --navy:#16226b; --nuit:#0a0f33; --bleu:#2b3a9c; --rouge:#e1131b; }
  * { box-sizing: border-box; } body { margin: 0; font-family: 'Public Sans', sans-serif; }
  .m { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--nuit); color: #fff; }
  .m > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .gt { position: absolute; left: 0; right: 0; top: 0; height: 380px; background: linear-gradient(180deg, rgba(10,15,51,.9), rgba(10,15,51,0)); }
  .gb { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(0deg, rgba(10,15,51,1) 0%, rgba(10,15,51,.92) 50%, rgba(10,15,51,0) 100%); }
  .head { position: absolute; left: 60px; right: 60px; top: 70px; display: flex; align-items: center; justify-content: space-between; }
  .head .id { display: flex; align-items: center; gap: 18px; }
  .head img { height: 104px; }
  .head p { margin: 0; font: 900 32px/1.1 'Public Sans'; letter-spacing: .04em; text-transform: uppercase; }
  .head small { display: block; margin-top: 4px; font: 600 21px 'Public Sans'; letter-spacing: 0; text-transform: none; color: #d5dbf3; }
  .play { position: absolute; right: 60px; top: 1010px; width: 150px; height: 150px; border-radius: 50%; background: var(--rouge); display: grid; place-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .play i { display: block; width: 0; height: 0; border-left: 50px solid #fff; border-top: 32px solid transparent; border-bottom: 32px solid transparent; margin-left: 12px; }
  .txt { position: absolute; left: 70px; right: 70px; bottom: 170px; }
  .tag { display: inline-block; padding: 12px 20px; background: #fff; color: var(--navy); font: 900 28px 'Public Sans'; letter-spacing: .14em; text-transform: uppercase; }
  .t { margin: 26px 0 0; font: 900 150px/.92 'Public Sans'; text-transform: uppercase; letter-spacing: -.02em; }
  .t span { color: #ffd23f; }
  .t::after { content: ''; display: block; width: 150px; height: 13px; margin-top: 30px; background: var(--rouge); }
  .s { margin: 30px 0 0; font: 700 40px/1.3 'Public Sans'; color: #e3e7f7; }
  .pills { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pills b { padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); font: 800 28px 'Public Sans'; }
</style></head>
<body>
<section class="m" id="m">
  <img class="bg" src="../img/v1.jpg">
  <div class="gt"></div><div class="gb"></div>
  <div class="head"><div class="id"><img src="../../img/ecusson.png"><p>Police municipale<small>Votre commune</small></p></div></div>
  <div class="play"><i></i></div>
  <div class="txt">
    <span class="tag">Pour les 9 – 11 ans</span>
    <p class="t">Le permis<br><span>vélo</span></p>
    <p class="s">4 règles pour rouler en sécurité.</p>
    <div class="pills"><b>Casque</b><b>Vélo vérifié</b><b>Bras tendu</b><b>Stop</b></div>
    <p style="margin:34px 0 0; font:600 18px 'Public Sans'; color:#8c96c8">Document de démonstration non officiel · illustrations générées par IA</p>
  </div>
</section>
</body></html>
