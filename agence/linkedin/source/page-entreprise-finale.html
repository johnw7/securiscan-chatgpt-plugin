<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; } body { margin: 0; background: #333; }
  .bn { position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #fff; background: linear-gradient(110deg, #021448 0%, #0b58ff 100%); margin-bottom: 20px; }
  h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -.045em; line-height: 1; margin: 0; }
</style>
</head>
<body>
<!-- Couverture de page entreprise 1128×191 : le logo de la page se pose en bas à gauche -->
<section class="bn" id="cover" style="width:1128px; height:191px">
  <div style="position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center">
    <h1 style="font-size:40px">Ce qui ne se voit pas ne se vend pas.</h1>
    <div style="margin:14px auto 0; width:48px; height:2.5px; background:#01daff"></div>
    <p style="margin:12px 0 0; font:600 13px Inter; color:rgba(255,255,255,.88)">E-DUST Solutions · Agence de communication digitale</p>
  </div>
</section>
</body>
</html>
