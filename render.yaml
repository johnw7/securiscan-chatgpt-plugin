# Mise en ligne de NOAMIS — Espace Projet sur Render (https://render.com)
services:
  - type: web
    name: noamis-espace-projet
    runtime: docker
    plan: free
    dockerfilePath: ./noamis-espace-projet/Dockerfile
    dockerContext: ./noamis-espace-projet
    buildFilter:
      paths:
        - noamis-espace-projet/**
    healthCheckPath: /connexion
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Démonstration : comptes et données fictives recréés si la base est vide.
      # Passer à "false" pour un usage réel (avec un disque persistant, voir README).
      - key: DEMO_MODE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "NOAMIS Espace Projet <no-reply@noamis.fr>"
