function render(t){
 measure();const vh=H/100,vw=W/100;
 // fenêtres + transitions « fuite de lumière »
 WINS.forEach(([id,a,b],k)=>{const e=Q('#'+id);const X=.35;e.style.opacity=Math.min(k?seg(t,a-X/2,a+X/2):1,1-seg(t,b-X/2,b+X/2));e.style.zIndex=5+k;});
 let leak=0,lc='255,255,255';WINS.slice(1).forEach(([id,a],k)=>{const d=Math.exp(-Math.pow((t-a)/.18,2));if(d>leak){leak=d;const s=SECT[k-1];lc=s?hexRGB(s.c2):'255,220,180'}});
 Q('#leak').style.opacity=leak*.85;Q('#leak').style.background=`radial-gradient(60% 50% at ${30+hash(Math.round(t))*40}% 40%,rgba(${lc},.9),rgba(${lc},.25) 50%,transparent 75%)`;
 const lb=(es(seg(t,2.0,2.6))-es(seg(t,25.8,26.4)))*(R45?5:7);document.querySelectorAll('#bars i').forEach(e=>e.style.height=lb+'vh');
 const fb=Q('#fxb'),ff=Q('#fxf');for(const c of [fb,ff])if(c.width!==W){c.width=W;c.height=H}
 const gb=fb.getContext('2d'),gf=ff.getContext('2d');gb.clearRect(0,0,W,H);gf.clearRect(0,0,W,H);
 const slow=t*.35; // temps ralenti
 // ---------- miniature ----------
 if(t<2.6){const pos=R45?[[-28,-1],[25,-8],[-31,24],[26,20],[2,26],[1,6]]:[[-26,-3],[24,-10],[-27,19],[23,13],[1,25],[2,4]];
  const scl=R45?.72:1;
  pos.forEach(([x,y],i)=>{const e=Q('#kv'+i);const fl=Math.sin(t*1.2+i)*.8;e.style.transform=`translate(-50%,-50%) translate(${x*vw}px,${(y+fl)*vh}px) scale(${scl}) rotate(${Math.sin(t+i)*4+(i==0?-10:0)}deg)`;});
  Q('#kvcam').style.transform=`scale(${1+.03*t})`;
  const lg=Q('#kvLogo');lg.style.top=(R45?3.5:4.5)+'vh';lg.style.transform='translateX(-50%)';
  Q('#kvH').style.top=(R45?11:12.5)+'vh';Q('#kvS').style.top=(R45?82:83.5)+'vh';
  const pl=Q('#kvP');pl.style.top=(R45?88:89)+'vh';pl.style.transform=`translateX(-50%) scale(${1+.03*Math.sin(t*5)})`;
  // poussière dorée
  for(let i=0;i<60;i++){const x=hash(i)*W,y=H-((slow*H*.3*(.3+hash(i+1))+hash(i+2)*H)%H);gf.fillStyle=`rgba(255,220,160,${.3+.5*hash(i+3)})`;gf.beginPath();gf.arc(x,y,U*.2*(1+hash(i+4)),0,7);gf.fill();}}
 // ---------- intro ----------
 lineReveal(Q('#iL'),t,2.3,T0);const ik=Q('#iK');ik.style.top=(R45?60:58)+'vh';ik.style.opacity=seg(t,3.0,3.6)*(1-seg(t,T0-.35,T0));
 Q('#iL').style.top=(R45?36:38)+'vh';
 if(t>=2&&t<T0+.3){for(let i=0;i<4;i++){const p=((t-2)*.25+i/4)%1;gf.strokeStyle=`rgba(255,210,150,${.25*Math.sin(p*Math.PI)})`;gf.lineWidth=U*.3;gf.beginPath();gf.moveTo(-W*.2+p*W*1.4,0);gf.lineTo(-W*.6+p*W*1.4,H);gf.stroke();}}
 // ---------- secteurs ----------
 SECT.forEach((S,i)=>{const a=T0+i*SD,b=a+SD;if(t<a-.4||t>b+.4)return;const lt=t-a;const ph=seg(t,a-.2,b+.2);
  const cam=Q('#cam'+i);cam.style.transform=`scale(${1.0+.12*ph}) rotate(${(ph-.5)*3}deg)`;
  const kk=Q('#k'+i),ll=Q('#l'+i),nn=Q('#n'+i);kk.style.top=(R45?6:9)+'vh';ll.style.top=(R45?76:75)+'vh';nn.style.top=(R45?12:15)+'vh';
  kk.style.opacity=seg(t,a+.2,a+.7)*(1-seg(t,b-.3,b));lineReveal(ll,t,a+.5,b);nn.style.transform=`translateX(${(1-es(seg(t,a,a+1)))*-10}vw)`;
  const o=Q('#o'+i);const cy=R45?-2:-3;const fl=Math.sin(lt*1.2)*1.2;
  o.style.transform=`translate(-50%,-50%) translateY(${(cy+fl)*vh}px) rotate(${[-8,0,-4,0,-6,0][i]+Math.sin(lt*.8)*2}deg)`;
  const ox=W/2,oy=H/2+cy*vh,al=Math.min(seg(t,a-.3,a+.3),1-seg(t,b-.3,b+.3));const ls=lt*.4;
  if(i==0){ // glaçons + gouttes
   for(let j=0;j<8;j++){const an=j/8*6.283+ls*.9;const z=Math.sin(an);const x=ox+Math.cos(an)*W*.36,y=oy+(hash(j)-.5)*H*.4;spr(z<0?gb:gf,'ice',x,y,U*(13+5*hash(j))*(1+.35*z),ls*(hash(j+1)-.5)*2,z,al);}
   for(let j=0;j<50;j++){const life=(ls*(.3+hash(j)*.6)+hash(j+5))%1;const an=hash(j+9)*6.283;const d=W*(.15+life*.5);const z=hash(j+11)*2-1;
    spr(z<0?gb:gf,'drop',ox+Math.cos(an)*d,oy+Math.sin(an)*d*.6,U*(1.6+2*hash(j+13))*(1+.5*z),0,z,al*Math.sin(life*Math.PI));}}
  if(i==1){ // couches qui lévitent + graines
   o.querySelectorAll('.bl').forEach(g=>{const k=+g.dataset.i;const sp=(5-k)*-1;const off=(k-2.5)*18*(.6+.4*Math.sin(lt*.9))+Math.sin(lt*1.3+k)*4;g.setAttribute('transform',`translate(0 ${-off})`)});
   for(let j=0;j<40;j++){const y=oy-H*.35+((ls*H*.12*(.5+hash(j))+hash(j+2)*H*.8)%(H*.8));const x=ox+(hash(j+4)-.5)*W*.9;const z=hash(j+6)*2-1;
    const g=z<0?gb:gf;g.save();g.globalAlpha=al*.9;g.translate(x,y);g.rotate(ls*2+j);g.fillStyle=j%3?'#FFF1D0':'#7ED957';g.beginPath();g.ellipse(0,0,U*.8*(1+.4*z),U*.4,0,0,7);g.fill();g.restore();}}
  if(i==2){ // pétales + poudre d'or + anneau liquide
   for(let j=0;j<22;j++){const y=-H*.1+((ls*H*.18*(.5+hash(j))+hash(j+3)*H*1.2)%(H*1.2));const x=hash(j+5)*W+Math.sin(ls*2+j)*W*.05;const z=hash(j+7)*2-1;
    spr(z<0?gb:gf,'petal',x,y,U*(6+4*hash(j))*(1+.5*z),ls*(hash(j+8)-.5)*3+j,z,al*.95);}
   for(let j=0;j<80;j++){const x=hash(j+20)*W,y=H-((ls*H*.1*(.3+hash(j+21))+hash(j+22)*H)%H);gf.fillStyle=`rgba(255,215,140,${al*(.3+.6*hash(j+23))*(.5+.5*Math.sin(t*4+j))})`;gf.beginPath();gf.arc(x,y,U*.22,0,7);gf.fill();}
   const rr=W*.32*(1+.08*Math.sin(lt));for(const[g,a0,a1] of [[gb,Math.PI,6.283],[gf,0,Math.PI]]){g.save();g.globalAlpha=al*.7;g.strokeStyle='rgba(255,170,200,.8)';g.lineWidth=U*.8;g.shadowColor='#ff8ab0';g.shadowBlur=U*3;g.beginPath();g.ellipse(ox,oy+H*.05,rr,rr*.18,-.08,a0,a1);g.stroke();g.restore();}}
  if(i==3){ // grains qui tombent + vapeur
   for(let j=0;j<26;j++){const y=-H*.1+((ls*H*.25*(.5+hash(j))+hash(j+3)*H*1.2)%(H*1.2));const x=hash(j+5)*W;const z=hash(j+7)*2-1;
    spr(z<0?gb:gf,'bean',x,y,U*(5+3*hash(j))*(1+.6*z),ls*(hash(j+8)-.5)*4+j,z,al);}
   for(let j=0;j<3;j++){const p=(ls*.5+j/3)%1;gf.save();gf.globalAlpha=al*Math.sin(p*Math.PI)*.5;gf.strokeStyle='#fff';gf.lineWidth=U*1.4;gf.filter=`blur(${U*.8}px)`;gf.beginPath();
    const bx=ox+(j-1)*W*.08,by=oy-H*.08-p*H*.18;gf.moveTo(bx,by+H*.1);gf.bezierCurveTo(bx+U*6,by+H*.06,bx-U*6,by+H*.03,bx+Math.sin(lt+j)*U*3,by);gf.stroke();gf.restore();}}
  if(i==4){ // interfaces flottantes + traînées lumineuses
   [['#ui1',-30,-16],['#ui2',22,-4],['#ui3',-24,14]].forEach(([s,x,y],k)=>{const e=Q(s);const p=eb(seg(t,a+.4+k*.35,a+.9+k*.35));e.style.left=(50+x)+'vw';e.style.top=(50+y+(R45?-3:-3)+Math.sin(lt+k)*1)+'vh';e.style.opacity=cl(p*2);e.style.transform=`translate(-50%,-50%) scale(${.7+.3*p})`;});
   for(let k=0;k<5;k++){const p=(ls*.6+k/5)%1;gb.save();gb.globalAlpha=al*Math.sin(p*Math.PI)*.8;gb.strokeStyle=k%2?'rgba(85,216,255,.9)':'rgba(255,90,140,.9)';gb.lineWidth=U*.5;gb.shadowColor=gb.strokeStyle;gb.shadowBlur=U*3;
    gb.beginPath();gb.ellipse(ox,oy,W*(.3+k*.06),H*(.12+k*.03),.5-k*.25,p*6,p*6+1.6);gb.stroke();gb.restore();}}
  if(i==5){ // éclats + caustiques
   o.querySelectorAll('.facets polygon').forEach((pg,k)=>{pg.style.opacity=.75+.25*Math.sin(lt*3+k*1.7)});
   for(let j=0;j<7;j++){const p=(ls*1.4+hash(j))%1;const x=ox+(hash(j+1)-.5)*W*.14,y=oy-H*.02+(hash(j+2)-.5)*H*.06;star(gf,x,y,U*(.8+1.6*hash(j+3))*Math.sin(p*Math.PI),al*.9*Math.sin(p*Math.PI));}
  }
 });
 // ---------- fin ----------
 const oa=T0+6*SD;const ol=Q('#oLogo');ol.style.top=(R45?16:20)+'vh';const op=eb(seg(t,oa+.2,oa+.8));ol.style.transform=`translateX(-50%) scale(${.7+.3*op})`;ol.style.opacity=cl(op*2);
 const ln=Q('#oLine');ln.style.top=(R45?46:46)+'vh';lineReveal(ln,t,oa+.7,40);
 const oc=Q('#oCta');oc.style.top=(R45?70:68)+'vh';const cp=eb(seg(t,oa+1.6,oa+2));oc.style.opacity=cl(cp*2);oc.style.transform=`translateX(-50%) scale(${cp*(1+.03*Math.sin(t*5)*seg(t,oa+2.2,oa+2.6))})`;
 const os=Q('#oSub');os.style.top=(R45?79:77)+'vh';os.style.opacity=seg(t,oa+2.1,oa+2.6)*.85;
 if(t>=oa-.3){for(let i=0;i<50;i++){const x=hash(i+90)*W,y=H-((t*H*.05*(.3+hash(i+91))+hash(i+92)*H)%H);gf.fillStyle=`rgba(${['255,215,140','255,140,170','120,200,255'][i%3]},${.4*seg(t,oa-.3,oa+.4)})`;gf.beginPath();gf.arc(x,y,U*.22,0,7);gf.fill();}}
}
function hexRGB(h){const n=parseInt(h.slice(1),16);return `${n>>16&255},${n>>8&255},${n&255}`}
const HALO=['227,23,27','255,122,0','255,122,168','197,138,82','109,93,252','106,167,224'];
for(let i=0;i<6;i++){const f=`drop-shadow(0 0 calc(5*var(--u)) rgba(${HALO[i]},.55)) drop-shadow(0 calc(2*var(--u)) calc(3*var(--u)) rgba(0,0,0,.6))`;Q('#o'+i).style.filter=f;Q('#kv'+i).style.filter=f;}
window.render=render;
</script></body></html>
