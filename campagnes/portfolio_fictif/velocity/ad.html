/* Pub TikTok « Lâche tout » — marque fictive Velocity. Histoire sans personnage : le poids du quotidien, le déclic, la lévitation (montage énergique sur le tempo), la nouvelle vie, l'appel.

const cv=Q('#c'),g=cv.getContext('2d');const IM={};
const FONT='Syncopate',BODY='Inter';
async function loadAll(){
 await Promise.all(['700 40px Syncopate','400 40px Syncopate','800 40px Inter','600 40px Inter'].map(f=>document.fonts.load(f)));await document.fonts.ready;
 await Promise.all(['shoe','plate','rock1','rock2','rock3','rock4','splash1','splash2','logo','tagline'].map(n=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=`assets/${n}.${n=='plate'?'jpg':'png'}`;IM[n]=i})));
 const gc=document.createElement('canvas');gc.width=gc.height=256;const x=gc.getContext('2d');const d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=hash(i*.37)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);IM.grain=gc;
}
window.DUR=TL.dur;
window.init=async a=>{R45=a==='45';cv.width=innerWidth;cv.height=innerHeight;await loadAll();return window.DUR};
const SW=747,SH=736,RAD=Math.PI/180;
const S0=TL.s.s0,S1=TL.s.s1,S2=TL.s.s2,S3=TL.s.s3,S4=TL.s.s4,BEAT=60/TL.bpm;
const ease=(x)=>x*x*(3-2*x);
// ---------- éléments aléatoires fixes
const ROCKS=[ // [image, x, yRepos, taille, profondeur]
 ['rock3',.17,.80,.30,0],['rock2',.84,.79,.22,0],['rock1',.07,.70,.26,1],['rock4',.92,.88,.12,0],['rock3',.70,.86,.20,1],
 ['rock2',.30,.90,.18,1],['rock1',.55,.93,.30,1],['rock4',.12,.55,.10,1],['rock2',.9,.45,.16,1],['rock3',.4,.2,.14,1],['rock4',.75,.2,.09,1],['rock1',.2,.3,.2,1],['rock2',.65,.1,.1,1],['rock4',.45,.8,.09,0]];
const DROPS=[...Array(90)].map((_,i)=>({a:hash(i)*6.283,r:.1+hash(i+3)*.45,s:.8+hash(i+5)*5,v:.2+hash(i+7),t:hash(i+9)*3,l:1+hash(i+11)*2}));
function drawImg(img,cx,cy,w,rot=0,al=1,flip=1){const h=w*img.naturalHeight/img.naturalWidth;g.save();g.globalAlpha=al;g.translate(cx,cy);g.rotate(rot);g.scale(flip,1);g.drawImage(img,-w/2,-h/2,w,h);g.restore()}
function plate(zoom,px,py,filter,al=1){const sc=Math.max(W/941,H/1672)*zoom;g.save();g.globalAlpha=al;g.filter=filter||'none';g.translate(W/2+px,H/2+py);g.scale(sc,sc);g.drawImage(IM.plate,-941/2,-1672/2);g.restore()}
function glow(cx,cy,r,rgb,a,mode='lighter'){g.save();g.globalCompositeOperation=mode;const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(cx-r,cy-r,2*r,2*r);g.restore()}
function ring(cx,cy,r,p,a,lw,warm){if(p<=0||a<=0)return;g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.shadowColor=warm?'rgba(255,200,140,.9)':'rgba(190,210,255,.8)';g.shadowBlur=lw*3;g.strokeStyle=`rgba(255,255,255,${a})`;g.lineWidth=lw;g.beginPath();g.arc(cx,cy,r,-Math.PI*.62,-Math.PI*.62+Math.PI*2*Math.min(1,p));g.stroke();g.restore()}
function radial(cx,cy,k,t,col,len,lw=2){if(k<=0)return;g.save();g.globalCompositeOperation='lighter';const R0=Math.hypot(W,H);for(let i=0;i<70;i++){const an=hash(i)*6.283,ph=(t*(2.5+hash(i+4)*2)+hash(i+7))%1,r0=R0*(.14+.26*hash(i+2))+ph*R0*.4,r1=r0+R0*len*(.4+hash(i+5));const x0=cx+Math.cos(an)*r0,y0=cy+Math.sin(an)*r0,x1=cx+Math.cos(an)*r1,y1=cy+Math.sin(an)*r1;const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,`rgba(255,255,255,0)`);gr.addColorStop(1,`rgba(${col},${k*(.25+.5*hash(i+6))})`);g.strokeStyle=gr;g.lineWidth=lw*(.6+hash(i+8)*1.6);g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}g.restore()}
function streaks(k,t,col,dir=1){if(k<=0)return;g.save();g.globalCompositeOperation='lighter';for(let i=0;i<26;i++){const y=hash(i+30)*H,ph=((t*(1.6+hash(i+31)*1.6)*dir)+hash(i+32))%1,len=W*(.35+hash(i+33)*.8);const x=(dir>0?ph*(W+len)-len:W-ph*(W+len));const gr=g.createLinearGradient(x,0,x+len*dir,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(${col},${k*(.2+.5*hash(i+34))})`);g.fillStyle=gr;g.fillRect(Math.min(x,x+len*dir),y,len,1.5+hash(i+35)*3.5)}g.restore()}
function mist(t,heat){const c=heat>.5?'255,205,150':'150,170,200';[[.2,.3,.5],[.8,.55,.6],[.45,.8,.55]].forEach((m,i)=>glow(W*(m[0]+.06*Math.sin(t*.35+i*2)),H*(m[1]+.03*Math.cos(t*.3+i)),W*m[2],c,.07+.05*heat))}
function drop(x,y,r,al,trail=0,ang=0){g.save();g.globalAlpha=al;if(trail>0){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=Math.max(1,r*.8);g.beginPath();g.moveTo(x,y);g.lineTo(x-Math.cos(ang)*trail,y-Math.sin(ang)*trail);g.stroke()}const gr=g.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.45,'rgba(220,235,255,.45)');gr.addColorStop(1,'rgba(200,220,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.restore()}
function fitFont(txt,w,px,weight=700,fam=FONT){g.font=`${weight} ${px}px ${fam}`;const m=g.measureText(txt).width;return m>w?px*w/m:px}

 px=fitFont(txt,o.maxW||W*.86,px,wt,fam);g.font=`${wt} ${px}px ${fam}`;g.translate(x,y);if(o.rot)g.rotate(o.rot);if(o.sc)g.scale(o.sc,o.sc);
 if(o.split){g.globalAlpha=al*.8;g.globalCompositeOperation='screen';g.fillStyle='#ff2a4a';g.fillText(txt,-o.split,0);g.fillStyle='#22d3ff';g.fillText(txt,o.split,0);g.globalCompositeOperation='source-over'}
 g.globalAlpha=al;g.shadowColor=o.glow||'rgba(0,0,0,.6)';g.shadowBlur=o.blur==null?px*.3:o.blur;g.fillStyle=o.col||'#fff';g.fillText(txt,0,0);g.restore()}
function slamT(txt,t,t0,dur,x,y,px,o={}){const p=t-t0;if(p<0||p>dur)return;const a=eo(seg(p,0,.14)),fo=1-seg(p,dur-.3,dur);const sc=mix(1.9,1,eo(seg(p,0,.2)));text(txt,x+(o.dx||0)*(1-eo(seg(p,0,.2))),y,px,{...o,al:a*fo,sc,split:(o.noSplit?0:px*.08*Math.max(0,1-p/.35))})}
function icon(kind,cx,cy,r,al=1,col='#fff'){g.save();g.globalAlpha=al;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=r*.1;g.lineCap='round';g.lineJoin='round';g.beginPath();g.arc(cx,cy,r,0,6.283);g.stroke();g.translate(cx,cy);const s=r*.5;g.beginPath();
 if(kind=='feather'){g.moveTo(-s*.8,s*.9);g.quadraticCurveTo(-s*.9,-s*.2,s*.2,-s*.9);g.quadraticCurveTo(s*1.0,-s*.3,s*.1,s*.3);g.quadraticCurveTo(-s*.3,s*.7,-s*.8,s*.9);g.moveTo(-s*.8,s*.9);g.lineTo(s*.35,-s*.35);g.stroke()}
 else if(kind=='bolt'){g.moveTo(s*.2,-s*1.05);g.lineTo(-s*.6,s*.15);g.lineTo(-s*.05,s*.15);g.lineTo(-s*.2,s*1.05);g.lineTo(s*.6,-s*.2);g.lineTo(s*.05,-s*.2);g.closePath();g.fill()}
 else{g.moveTo(-s*1.0,s*.75);g.lineTo(-s*.25,-s*.45);g.lineTo(s*.2,s*.2);g.lineTo(s*.45,-s*.15);g.lineTo(s*1.0,s*.75);g.closePath();g.stroke()}g.restore()}
function pill(txt,cx,cy,px,al,bg='#fff',fg='#0b0b0c'){if(al<=0)return;g.save();g.globalAlpha=al;g.font=`800 ${px}px ${BODY}`;g.letterSpacing=px*.08+'px';const w=g.measureText(txt).width+px*2.6,h=px*2.5;g.fillStyle=bg;g.shadowColor='rgba(255,255,255,.4)';g.shadowBlur=px*1.2;g.beginPath();g.roundRect(cx-w/2,cy-h/2,w,h,h/2);g.fill();g.shadowBlur=0;g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,cx,cy+px*.04);g.restore()}
// ---------- chaussure
function shoe(cx,cy,scale,rot,o={}){const Ws=W*(R45?.74:.9)*scale,Hs=Ws*SH/SW;const flip=o.flip||1;
 const trail=o.trail||0;if(trail>0)for(let i=trail;i>=1;i--){const f=i/trail;g.save();g.filter=`blur(${2+f*5}px) brightness(${1+.3*f}) saturate(1.2)`;drawImg(IM.shoe,cx-(o.vx||0)*f*.06*trail*W*.02,cy-(o.vy||0)*f*.06*trail*W*.02,Ws*(1-.015*f),rot,.16*(1-f)*(o.ta||1),flip);g.restore()}
 g.save();g.filter=o.filter||'none';if(o.rim){g.shadowColor=o.rim;g.shadowBlur=Ws*.05}drawImg(IM.shoe,cx,cy,Ws,rot,o.al==null?1:o.al,flip);g.restore();return{Ws,Hs}}
function reflect(cx,cy,scale,rot,groundY,al,filter){const Ws=W*(R45?.74:.9)*scale,Hs=Ws*SH/SW;g.save();const oc=reflect.oc||(reflect.oc=document.createElement('canvas'));oc.width=W;oc.height=H;const x=oc.getContext('2d');x.clearRect(0,0,W,H);x.save();x.translate(cx,groundY*2-cy);x.scale(1,-1);x.rotate(rot);x.filter=filter||'none';x.drawImage(IM.shoe,-Ws/2,-Hs/2,Ws,Hs);x.restore();x.globalCompositeOperation='destination-in';const gr=x.createLinearGradient(0,groundY,0,groundY+Hs*.55);gr.addColorStop(0,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,groundY,W,Hs);g.globalAlpha=al;g.filter='blur(2px)';g.drawImage(oc,0,0);g.restore()}
// ---------- caméra, tempo, secousses
const beatPulse=t=>{const ph=((t-S2)/BEAT)%1;return Math.exp(-ph*7)};
const SHK=[[...TL.rocks,TL.s.s2,TL.slams[0][0],TL.slams[1][0],TL.slams[2][0],TL.slams[3][0]].map(v=>[v,1])];
function shakeAmt(t){let s=0;[...TL.rocks.map(v=>[v,.8]),[S2,2.2],...TL.slams.map(v=>[v[0],1.3]),[S4+.3,1.4]].forEach(([a,k])=>{const d=t-a;if(d>=0&&d<.5)s+=k*Math.exp(-d*9)});return s}
function flashAmt(t){let f=0;[[S0-.02,.9],[S2-.02,1],[S2+TL.cuts2.length*0,0],[TL.cuts2[1],.35],[TL.cuts2[2],.4],[TL.cuts2[3],.4],[TL.cuts2[4],.4],[TL.cuts2[5],.45],[S3-.04,1],[S4+.0,.0],[TL.logo,.85]].forEach(([a,k])=>{const d=t-a;if(d>=0&&d<.35)f=Math.max(f,k*(1-d/.35))});if(t>S2-.5&&t<S2)f=Math.max(f,.25*seg(t,S2-.5,S2));if(t>S3-.5&&t<S3)f=Math.max(f,.9*seg(t,S3-.5,S3));return f}
function draw(TT){
 measure();const t=TT,Wd=W,Hd=H;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';g.globalCompositeOperation='source-over';g.fillStyle='#050507';g.fillRect(0,0,W,H);
 const px=(a,b)=>R45?b:a;const cx0=W/2;const U2=W/100;
 // état général
 const heat=t<S0?1:t<S1?mix(0,.0,0):t<S2?0:1;const cold=t>=S0&&t<S2;
 const beat=t>=S2&&t<S3?beatPulse(t):0;const shk=shakeAmt(t);
 // caméra
 let zoom=1,rotC=0,camx=0,camy=0;
 // ----- pose de la chaussure et décor par plan
 let sx=cx0,sy=H*.5,ss=1,sr=-24*RAD,flip=1,trail=0,vx=0,vy=0,heatK=1,ringP=1,ringA=.8,radK=0,strK=0,pGrade='none',sGrade='none',rockMode='float',glowK=.8,dark=0,slowK=0;
 const coverT=TL.cover;
 if(t<coverT){ // couverture : plan héros
  sx=cx0;sy=H*px(.42,.45);ss=px(.8,.86);sr=Math.sin(t*1.6)*.02;zoom=1.04-.02*t;ringP=1;ringA=.95;pGrade='saturate(1.1) brightness(.9)';radK=.25;
 }else if(t<S1){ // S0 : le poids du quotidien — chaussure à terre, roches qui tombent, froid
  const p=seg(t,S0,S1);heatK=0;ringP=0;ringA=0;sr=-22*RAD+Math.sin(t*38)*.004*(1+seg(t,S0,S1)*2);ss=px(.62,.7);sx=cx0;sy=H*px(.73,.74)+p*H*.012;zoom=1.02+.05*p;camy=p*H*.012;pGrade='grayscale(.78) brightness(.5) contrast(1.15)';sGrade='saturate(.55) brightness(.8)';rockMode='fall';glowK=.12;
 }else if(t<S2){ // S1 : le déclic — noir, anneau de lumière qui se dessine, la chaussure frémit
  const p=seg(t,S1,S2);heatK=0;ringP=eo(seg(t,S1+.8,S2-.3));ringA=.9*ringP;sr=mix(-22,-10,eo(seg(p,.55,1)))*RAD+Math.sin(t*30)*.006*p;sx=cx0;sy=H*px(.73,.74)-eo(seg(p,.5,1))*H*.12;ss=px(.62,.7)*(1+.1*eo(seg(p,.5,1)));pGrade='grayscale(.6) brightness(.28)';sGrade=`brightness(${.55+.7*p}) saturate(${.6+.8*p})`;dark=1-p*.3;rockMode='tremble';glowK=.1+.9*p;zoom=1.07-.04*p;
 }else if(t<S3){ // S2 : la lévitation — montage sur le tempo
  const cs=TL.cuts2;let sh=0;cs.forEach((c,i)=>{if(t>=c)sh=i});const a=cs[sh],b=sh<cs.length-1?cs[sh+1]:S3,p=seg(t,a,b),l=t-a;heatK=1;ringP=1;ringA=.95;glowK=.9;pGrade='saturate(1.15) brightness(.95) contrast(1.1)';sGrade='saturate(1.1) contrast(1.05)';rockMode='float';
  if(sh==0){const q=eo(seg(l,0,1.2));sx=cx0;sy=mix(H*px(.72,.73),H*px(.46,.48),q);ss=mix(px(.62,.7),px(.95,.98),q);sr=mix(-22,4,q)*RAD;zoom=1.18-.18*eo(seg(l,0,1.4));radK=.35;trail=3;vy=-1.6}
  if(sh==1){sx=cx0+Math.sin(l*2.4)*W*.03;sy=H*px(.46,.48);ss=px(1.28,1.25);sr=(12+8*Math.sin(l*2))*RAD;zoom=1.12;rotC=(5-3*p)*RAD;radK=1;trail=5;vx=Math.cos(l*2.4)*2;strK=.4}
  if(sh==2){const q=eio(seg(l,0,.9));sx=mix(-W*.5,W*1.5,q)*(l<.9?1:0)+(l>=.9?mix(W*1.5,cx0,eo(seg(l,.9,1.5))):0);if(l>=.9)sx=mix(W*1.35,cx0,eo(seg(l,.9,1.6)));sy=H*px(.46,.48);ss=px(.95,.98);sr=2*RAD;trail=l<1.1?8:2;vx=l<1.1?14:0;strK=l<1.1?1:.4;zoom=1+.04*p;radK=.2}
  if(sh==3){sx=mix(cx0+W*.1,cx0-W*.1,p);sy=H*px(.58,.6);ss=px(1.7,1.55);sr=(-6+6*p)*RAD;zoom=1.06;rotC=-4*RAD;strK=.9;radK=.5;trail=4;vx=-6}
  if(sh==4){flip=-1;sx=cx0+Math.sin(l*1.8)*W*.04;sy=H*px(.45,.47)+Math.sin(l*3)*H*.01;ss=px(1.02,1.0);sr=(6-6*p)*RAD;zoom=1.0+.06*Math.sin(p*3.14);rotC=(-6+10*p)*RAD;radK=.55;trail=4;vx=3}

 }else if(t<S4){ // S3 : la nouvelle vie — calme, doré, ralenti
  const l=t-S3,p=seg(t,S3,S4);heatK=1;ringP=1;ringA=.65;glowK=1;pGrade='saturate(1.05) brightness(.8) sepia(.2)';sGrade='saturate(1.1) brightness(1.02)';rockMode='drift';
  sx=cx0;sy=H*px(.43,.46)+Math.sin(l*1.1)*H*.012;ss=px(.9,.9)*(1+.03*p);sr=(-3+4*Math.sin(l*.9))*RAD;zoom=1.04-.03*p;slowK=1;
 }else{ // S4 : appel à l'action — logo
  const l=t-S4;heatK=1;ringP=1;ringA=.5;glowK=.7;pGrade='saturate(1.0) brightness(.62)';sGrade='saturate(1.05)';rockMode='drift';
  sx=cx0;sy=H*px(.27,.3)+Math.sin(l*1.1)*H*.008;ss=px(.5,.46);sr=0;zoom=1.0;slowK=1;
 }
 // ----- dessin
 g.save();
 const sh_=shk*U2*1.2;g.translate(W/2+camx+(hash(Math.floor(t*60))-.5)*sh_*2,H/2+camy+(hash(Math.floor(t*60)+7)-.5)*sh_*2);g.rotate(rotC);g.scale(zoom*(1+.03*beat),zoom*(1+.03*beat));g.translate(-W/2,-H/2);
 const pz=1.06+.0*t;plate(pz+.02*Math.sin(t*.3),Math.sin(t*.25)*W*.02,(t<S1?-H*.02:0),pGrade);

 mist(t,heatK);
 const ringC=[W*(R45?.5:.52),sy];ring(ringC[0],ringC[1]-H*.02,W*(R45?.56:.6),ringP,ringA,W*.012,heatK>.5);

 if(strK>0)streaks(strK*.7,t,'255,240,220',(t>S2&&Math.floor((t-S2)/ (BEAT*4))%2)?-1:1);
 // roches (fond)
 const rocks=(front)=>ROCKS.forEach((r,i)=>{const[nm,rx,ry,rs,dp]=r;if(!!dp!==front&&false)return;let x=rx*W,y=ry*H,rot=(hash(i+40)-.5)*1.2,sc=rs*W;let al=1,bl=0;
