<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Les Fistons — proposition vidéo E-DUST</title>
<!-- Charte relevée sur restaurant-lesfistons.fr : #212527 · #e63c1e · #fbf7cd · #f3f1ea ; Gobold -> Oswald, BonneMamanScript -> Yellowtail -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&family=Yellowtail&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="../demos_portfolio/common.js"></script>
<style>
:root{--ink:#212527;--red:#e63c1e;--cream:#fbf7cd;--off:#f3f1ea;--u:min(1vw,.7vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--ink);font-family:Lato,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
/* thèmes aux couleurs du restaurant */
.dark{background:radial-gradient(80% 55% at 50% 50%,#2c3134,#212527 70%);--fg:var(--cream);--sc:var(--red);--fr:var(--off);--ol:rgba(251,247,205,.10)}
.cream{background:radial-gradient(80% 55% at 50% 50%,#fffbe0,#fbf7cd 70%);--fg:var(--ink);--sc:var(--red);--fr:var(--ink);--ol:rgba(230,60,30,.16)}
.red{background:radial-gradient(80% 55% at 50% 50%,#f04a2a,#e63c1e 70%);--fg:var(--cream);--sc:var(--ink);--fr:var(--cream);--ol:rgba(33,37,39,.16)}
.mq{position:absolute;left:0;white-space:nowrap;font-family:Oswald;font-weight:700;font-size:calc(30*var(--u));line-height:1;color:transparent;-webkit-text-stroke:calc(.35*var(--u)) var(--ol);text-transform:uppercase}
.ging{position:absolute;left:0;right:0;height:2.4vh;z-index:20;background-color:var(--cream);
 background-image:linear-gradient(90deg,rgba(230,60,30,.55) 50%,transparent 50%),linear-gradient(0deg,rgba(230,60,30,.55) 50%,transparent 50%);background-size:2.4vh 2.4vh}

.card{position:absolute;left:50%;top:50%;border:calc(1.1*var(--u)) solid var(--fr);border-radius:calc(.5*var(--u));box-shadow:0 calc(2.4*var(--u)) calc(6*var(--u)) rgba(0,0,0,.45);background:var(--fr);overflow:hidden;z-index:5}

.label{position:relative;display:inline-block;padding:calc(2.2*var(--u)) calc(7*var(--u));color:var(--cream);text-align:center}
.label svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.label .t{position:relative;font-family:Oswald;font-weight:700;font-size:calc(12*var(--u));line-height:.95;letter-spacing:.02em;text-shadow:calc(.5*var(--u)) calc(.5*var(--u)) 0 var(--ink)}
.label .s{position:relative;font-family:Yellowtail;font-size:calc(5*var(--u));color:var(--cream)}
.red .label path:first-child{fill:#212527}
.pill{position:absolute;left:50%;display:flex;align-items:center;gap:calc(1.6*var(--u));font-family:Oswald;font-weight:500;font-size:calc(3.4*var(--u));letter-spacing:.18em;background:var(--ink);border:calc(.35*var(--u)) solid var(--cream);border-radius:999px;padding:calc(1*var(--u)) calc(3.4*var(--u)) calc(1*var(--u)) calc(1.2*var(--u));white-space:nowrap;z-index:12;color:var(--cream)}

.logoCard{display:inline-block;background:#fff;border-radius:calc(2*var(--u));padding:calc(1.6*var(--u)) calc(2.6*var(--u));width:min(72vw,52vh);box-shadow:0 calc(1.6*var(--u)) calc(5*var(--u)) rgba(0,0,0,.3)}
.logoCard img{display:block;width:100%}
#credit{position:absolute;left:4vw;right:4vw;bottom:3.2vh;text-align:center;font-size:calc(1.7*var(--u));z-index:50}
#wipe{position:absolute;top:-10%;height:120%;width:200vw;z-index:45;pointer-events:none}

#grain{position:absolute;inset:0;z-index:41;opacity:.06;pointer-events:none;background-size:200px 200px;mix-blend-mode:multiply}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
</style></head><body>
<div id="stage"><div id="scenes"></div><canvas id="fx"></canvas><div id="grain"></div><div id="wipe"><i></i><i></i><i></i></div>

<script>

const COL={dark:'#212527',cream:'#fbf7cd',red:'#e63c1e'};
const S=[
 {id:'kv',th:'dark',a:-1,b:2.2,p:[['entrecote',1]],mq:'LES FISTONS'},
 {id:'s1',th:'cream',a:2.2,b:6,p:[['facade',1.5],['terrasse',2.4]],k:'LE TOUT NOUVEAU',big:'BISTROQUET',scr:'de Saint-Germain-en-Laye',st:'DEPUIS<br>LA PLACE<br>DU CHÂTEAU'},
 {id:'s2',th:'dark',a:6,b:9.6,p:[['chateau',1.5]],k:'AU PIED DU',big:'CHÂTEAU',scr:'une adresse historique'},
 {id:'s3',th:'red',a:9.6,b:13.4,p:[['entrecote',1]],k:'LE COMPTOIR À VIANDES',big:'VIANDES DE RACE',scr:'maturées & tracées',cap:'Entrecôte maturée 300 g · sauce poivre qui tue',st:'100 %<br>TRACÉES'},

 {id:'s5',th:'dark',a:17,b:20.6,p:[['vins',1.5],['vins2',1.5]],k:'UNE CARTE DE',big:'GRANDS VINS',scr:'à partager'},
 {id:'s6',th:'red',a:20.6,b:24.2,p:[['salle',1],['salle2',2.4]],k:'UNE AMBIANCE',big:'AUTHENTIQUE',scr:'inspirations brocantesques'},
 {id:'s7',th:'cream',a:24.2,b:27.6,p:[['amis',1.5],['burger',2.4]],k:'DU LUNDI AU VENDREDI',big:'AFTER WORK',scr:'dès 17h30',cap:'Privatisation dès 20 personnes',st:'OUVERT<br>7J/7'},
 {id:'s8',th:'dark',a:27.6,b:30.8,p:[],mq:'RÉSERVEZ'},
 {id:'s9',th:'red',a:30.8,b:36,p:[],mq:'VOTRE FILM'}];
const root=Q('#scenes');
S.forEach(s=>{const e=document.createElement('section');e.className='sc '+s.th;e.id=s.id;
 const w=(s.mq||s.big||'').replace(/ /g,' ');
 let h=`<div class="mq m1">${(w+' · ').repeat(4)}</div><div class="mq m2">${(w+' · ').repeat(4)}</div><div class="ging t"></div><div class="ging b"></div>`;
 s.p.forEach(([n],j)=>{h+=`<div class="card c${j}"><img src="${A}${n}.jpg"></div>`});
 if(s.big)h+=`<div class="blk top"><div class="kick">${s.k}</div><div class="big">${s.big.split(' ').map(x=>`<span>${x}</span>`).join(' ')}</div></div><div class="blk bot"><div class="scr">${s.scr}</div><span class="ul"></span>${s.cap?`<div class="capt">${s.cap}</div>`:''}</div>`;
 if(s.st)h+=`<div class="stamp">${s.st}</div>`;
 e.innerHTML=h;root.appendChild(e);});
Q('#kv').insertAdjacentHTML('beforeend',`<div class="blk top" style="z-index:12"><div class="label">${LABEL}<div class="t">LES FISTONS</div><div class="s">bistroquet · Saint-Germain-en-Laye</div></div></div>
 <div class="blk bot" style="z-index:12"><div class="big" style="font-size:calc(6.4*var(--u))">VIANDES DE RACE · GRANDS VINS</div></div><div class="pill" id="kvp"><i>▶</i>DÉCOUVREZ LE FILM</div>`);
Q('#s8').insertAdjacentHTML('beforeend',`<div class="blk top" style="z-index:12"><div class="label">${LABEL}<div class="t">LES FISTONS</div><div class="s">Ouvert 7j/7</div></div></div>
 <div class="blk mid" style="z-index:12"><div class="info"><b>22 place Charles de Gaulle</b><br>Saint-Germain-en-Laye</div><span class="ul" style="width:calc(16*var(--u))"></span><div class="info" style="font-size:calc(3.6*var(--u));margin-top:calc(1.2*var(--u))">Lun.–sam. 6h – 1h · dim. 6h – 23h</div><div class="phone">RÉSERVEZ · 01 39 73 06 34</div></div>`);
Q('#s9').insertAdjacentHTML('beforeend',`<div class="blk top" style="z-index:12"><div class="kick">ET SI</div><div class="big" style="font-size:calc(9.4*var(--u))">CETTE VIDÉO<br>ÉTAIT LA VÔTRE ?</div><div class="scr" style="margin-top:calc(1.4*var(--u))">pensée pour Les Fistons</div></div>
 <div class="blk mid" style="z-index:12"><div class="logoCard"><img src="../edust_onboarding/assets/edust-solutions-logo.png"></div>
 <div class="info" style="font-size:calc(3.6*var(--u));margin-top:calc(2.4*var(--u))">Films de marque · Reels · Motion design</div></div>
 <div class="blk bot" style="z-index:12"><div class="phone" style="font-size:calc(5*var(--u))">PARLONS-EN ☕</div><div class="info" style="font-size:calc(3*var(--u));margin-top:calc(1.6*var(--u))">Tarik Belattar · tarikbelatta@gmail.com · 06 13 24 96 80</div></div>`);
{const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');const d=g.createImageData(200,200);for(let i=0;i<d.data.length;i+=4){const v=200+hash(i*.37)*55;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);Q('#grain').style.backgroundImage=`url(${c.toDataURL()})`}
const es=x=>x*x*(3-2*x);
function reveal(el,t,a,dy=2){if(!el)return;const p=es(seg(t,a,a+1.0));el.style.opacity=p;el.style.filter=`blur(${(1-p)*8}px)`;el.style.transform=`translateY(${(1-p)*dy*U}px)`}
function render(t){
 measure();const vh=H/100,vw=W/100;
 // scène visible = celle qui contient t (coupe franche, cachée par le volet)
 let cur=0;S.forEach((s,k)=>{if(t>=s.a)cur=k});
 S.forEach((s,k)=>{const e=Q('#'+s.id);e.style.opacity=k==cur?1:0;e.style.zIndex=k;if(k!=cur)return;
  const lt=t-s.a,ph=seg(t,s.a,s.b);
  // grands mots en contour qui défilent au ralenti
  const m1=e.querySelector('.m1'),m2=e.querySelector('.m2');
  m1.style.top=(R45?18:22)+'vh';m2.style.top=(R45?56:58)+'vh';
  m1.style.transform=`translateX(${-10-lt*2.2}vw)`;m2.style.transform=`translateX(${-60+lt*2.2}vw)`;
  // cartes photo entières
  const cards=[...e.querySelectorAll('.card')];
  cards.forEach((c,j)=>{const r=s.p[j][1];const main=j==0;
   let w=r>=2?(R45?84:92):r>=1.4?(R45?76:88):(R45?58:76);if(!main)w=r>=2?(R45?60:72):(R45?46:58);c.style.width=w+'vw';
   let cx=0,cy=s.id=='kv'?(R45?2:1):(R45?-1:-2);if(cards.length>1){cy=main?(R45?-8:-9):(R45?14:13);cx=main?-4:6;}
   const tin=s.id=='kv'?1:eo(seg(t,s.a+(main?.05:.55),s.a+(main?1.1:1.6)));
   const from=main?(k%2?-1:1)*60:(k%2?1:-1)*70;
   const dr=Math.sin(lt*.35+j)*.6;
   c.style.transform=`translate(-50%,-50%) translate(${(cx+dr+(1-tin)*from)*vw}px,${cy*vh}px) rotate(${(main?-1.6:3)+(1-tin)*(main?-8:10)+Math.sin(lt*.4+j)*.5}deg) scale(${.95+.05*ph})`;});
  // textes : mots du titre qui montent un par un
  const tp=e.querySelector('.blk.top'),bt=e.querySelector('.blk.bot'),md=e.querySelector('.blk.mid');const two=cards.length>1;
  if(tp)tp.style.top=(s.id=='s9'?(R45?6:9):s.id=='kv'?(R45?5:6):(R45?5:8))+'vh';
  if(bt)bt.style.top=(s.id=='kv'?(R45?77:76):s.id=='s9'?(R45?76:78):two?(R45?78:79):(R45?75:73))+'vh';
  if(md)md.style.top=(s.id=='s9'?(R45?40:44):(R45?38:40))+'vh';
  if(s.id!='kv'){
   if(tp){const kk=tp.querySelector('.kick');if(kk)reveal(kk,t,s.a+.25);
    tp.querySelectorAll('.big span').forEach((x,i)=>{const p=eb(seg(t,s.a+.4+i*.25,s.a+.95+i*.25));x.style.opacity=cl(p*2);x.style.transform=`translateY(${(1-p)*5*U}px) rotate(${(1-p)*-4}deg)`});
    const scs=tp.querySelector('.scr');if(scs)reveal(scs,t,s.a+1.2);}
   if(bt){reveal(bt.querySelector('.scr')||bt,t,s.a+1.0);const ul=bt.querySelector('.ul');if(ul)ul.style.width=(es(seg(t,s.a+1.4,s.a+2.2))*16)+'vw';
    const cp=bt.querySelector('.capt');if(cp){const p=eb(seg(t,s.a+1.7,s.a+2.1));cp.style.opacity=cl(p*2);cp.style.transform=`scale(${.7+.3*p})`;}
    if(s.id=='s9'){reveal(bt,t,s.a+1.6)}}
   if(md){reveal(md,t,s.a+.7);const ul=md.querySelector('.ul');}}
  const st=e.querySelector('.stamp');if(st){const p=eb(seg(t,s.a+1.3,s.a+1.7));st.style.left=(R45?72:70)+'vw';st.style.top=(s.id=='s1'?(R45?52:50):s.id=='s3'?(R45?24:27):(R45?52:50))+'vh';
   st.style.opacity=cl(p*2);st.style.transform=`rotate(${-14+lt*6}deg) scale(${.4+.6*p})`;}
 });
 const kp=Q('#kvp');kp.style.top=(R45?87:88)+'vh';kp.style.transform=`translateX(-50%) scale(${1+.03*Math.sin(t*5)})`;
 // volets diagonaux aux couleurs de la scène suivante
 const wp=Q('#wipe');let wo=0;
 for(let k=1;k<S.length;k++){const a=S[k].a;const p=seg(t,a-.45,a+.45);if(p>0&&p<1){const prev=COL[S[k-1].th],next=COL[S[k].th];
   const others=['#212527','#e63c1e','#fbf7cd'].filter(c=>c!=next);
   const ii=wp.querySelectorAll('i');ii[0].style.background=others[0];ii[1].style.background=others[1];ii[2].style.background=next;
   ii.forEach((x,j)=>{x.style.left=(j*33)+'%'});
   wp.style.transform=`translateX(${115-eio(p)*330}vw) skewX(-14deg)`;wo=1;}}
 wp.style.opacity=wo;
 const th=S.find((s,k)=>k==S.reduce((m,s2,k2)=>t>=s2.a?k2:m,0)).th;
 Q('#credit').style.color=th=='cream'?'rgba(33,37,39,.7)':'rgba(251,247,205,.75)';
 // poussière lumineuse sur les scènes sombres
 const cv=Q('#fx'),g=cv.getContext('2d');if(cv.width!==W){cv.width=W;cv.height=H}g.clearRect(0,0,W,H);
 if(th=='dark'){for(let i=0;i<40;i++){const z=hash(i+7);const y=H-((t*(.012+.03*z)*H+hash(i+2)*H*1.2)%(H*1.2));const x=hash(i)*W+Math.sin(t*.3+i)*W*.03;
  const r=U*(z>.8?2.4:.35+.6*z);const al=(z>.8?.1:.45)*(.5+.5*Math.sin(t*1.2+i*2));const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,210,140,${al})`);gr.addColorStop(1,'rgba(255,180,100,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}}
 // vapeur sur les plats chauds
 if(t>9.6&&t<17){for(let j=0;j<3;j++){const p=((t*.18)+j/3)%1;g.save();g.globalAlpha=.25*Math.sin(p*Math.PI);g.strokeStyle='#fff';g.lineWidth=U*2;g.filter=`blur(${U*1.2}px)`;
  const bx=W*(.38+j*.12),by=H*.42-p*H*.16;g.beginPath();g.moveTo(bx,by+H*.08);g.bezierCurveTo(bx+U*6,by+H*.05,bx-U*6,by+H*.02,bx+Math.sin(t+j)*U*3,by);g.stroke();g.restore();}}
}
window.render=render;
</script></body></html>
