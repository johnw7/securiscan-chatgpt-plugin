<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Les Fistons — version « chic bistrot »</title>
<!-- Charte restaurant-lesfistons.fr : #212527 · #e63c1e · #fbf7cd · #f3f1ea -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;500;700&family=Yellowtail&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="../demos_portfolio/common.js"></script>
<style>
:root{--ink:#212527;--red:#e63c1e;--cream:#fbf7cd;--off:#f3f1ea;--u:min(1vw,.7vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--ink);color:var(--cream);font-family:Lato,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(75% 55% at 50% 50%,#2b3033,#212527 65%,#1a1d1f)}
#frame{position:absolute;inset:2.4vh 3.6vw;border:calc(.25*var(--u)) solid rgba(251,247,205,.75);z-index:30;pointer-events:none}
#frame::after{content:'';position:absolute;inset:calc(1*var(--u));border:calc(.12*var(--u)) solid rgba(251,247,205,.45)}
.orn{position:absolute;width:calc(2.4*var(--u));height:calc(2.4*var(--u));background:var(--cream);transform:rotate(45deg);z-index:31}
.sc{position:absolute;inset:0;opacity:0}
.mat{position:absolute;left:50%;top:50%;background:var(--off);padding:calc(2.2*var(--u));box-shadow:0 calc(2.6*var(--u)) calc(7*var(--u)) rgba(0,0,0,.55)}
.mat::before{content:'';position:absolute;inset:calc(.9*var(--u));border:calc(.15*var(--u)) solid rgba(33,37,39,.35);pointer-events:none}
.mat img{display:block;width:100%;height:auto}
.blk{position:absolute;left:8vw;right:8vw;text-align:center;z-index:10}
.no{font-family:Oswald;font-weight:500;font-size:calc(2.6*var(--u));letter-spacing:.5em;padding-left:.5em;color:var(--red)}
.rule{display:block;height:calc(.18*var(--u));background:rgba(251,247,205,.7);margin:calc(1.4*var(--u)) auto;width:0}
.ttl{font-family:Oswald;font-weight:200;font-size:calc(9.6*var(--u));letter-spacing:.22em;padding-left:.22em;line-height:1.05;text-transform:uppercase}
.ttl b{font-weight:500}
.scr{font-family:Yellowtail;font-size:calc(8.6*var(--u));color:var(--cream);line-height:1.1;text-shadow:0 0 calc(2*var(--u)) rgba(0,0,0,.6)}
.menu{font-family:Oswald;font-weight:300;font-size:calc(3.5*var(--u));letter-spacing:.06em;text-align:left;line-height:1.55}
.menu div{display:flex;align-items:baseline;gap:calc(1*var(--u))}
.menu .dots{flex:1;border-bottom:calc(.25*var(--u)) dotted rgba(251,247,205,.55);transform:translateY(-.35em)}
.menu .pr{font-weight:500;color:var(--cream)}
.menu small{display:block;font-family:Lato;font-size:.62em;letter-spacing:.02em;color:rgba(251,247,205,.6);margin-top:-.4em;line-height:1.2}
.pill{position:absolute;left:50%;display:flex;align-items:center;gap:calc(1.6*var(--u));font-family:Oswald;font-weight:300;font-size:calc(3.2*var(--u));letter-spacing:.3em;border:calc(.25*var(--u)) solid var(--cream);border-radius:999px;padding:calc(1*var(--u)) calc(3.4*var(--u)) calc(1*var(--u)) calc(1.2*var(--u));white-space:nowrap;z-index:12}
.pill i{font-style:normal;width:calc(5.6*var(--u));height:calc(5.6*var(--u));border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:calc(2.4*var(--u));padding-left:.15em;color:#fff}
.info{font-family:Oswald;font-weight:300;font-size:calc(4.6*var(--u));letter-spacing:.08em;line-height:1.45}
.phone{display:inline-block;margin-top:calc(2.4*var(--u));border:calc(.3*var(--u)) solid var(--red);color:var(--cream);font-family:Oswald;font-weight:500;font-size:calc(5*var(--u));letter-spacing:.12em;padding:calc(1.2*var(--u)) calc(4*var(--u))}
.logoCard{display:inline-block;background:#fff;padding:calc(1.6*var(--u)) calc(2.6*var(--u));width:min(66vw,48vh)}
.logoCard img{display:block;width:100%}
#credit{position:absolute;left:6vw;right:6vw;bottom:4.2vh;text-align:center;font-size:calc(1.6*var(--u));color:rgba(251,247,205,.6);z-index:32}
#sweep{position:absolute;left:0;height:calc(.25*var(--u));background:var(--cream);z-index:33;box-shadow:0 0 calc(2*var(--u)) rgba(251,247,205,.8)}
#black{position:absolute;inset:0;background:#000;z-index:29;opacity:0}
#grain{position:absolute;inset:0;z-index:34;opacity:.06;pointer-events:none;background-size:200px 200px}
</style></head><body>
<div id="stage"><div id="scenes"></div><div id="black"></div><div id="frame"></div><div id="sweep"></div><div id="grain"></div>
<div id="credit">Proposition E-DUST Solutions pour Les Fistons · photos : site du restaurant (J. Célice / C. Sautet)</div></div>
<script>
window.DUR=35;
const A='assets/';
const S=[
 {id:'kv',a:-1,b:2.2,p:['entrecote',1]},
 {id:'s1',a:2.2,b:6,p:['facade',1.5],no:'N°01',t:'Le tout nouveau<br><b>bistroquet</b>',scr:'de Saint-Germain-en-Laye'},
 {id:'s2',a:6,b:9.6,p:['chateau',1.5],no:'N°02',t:'Au pied<br><b>du château</b>',scr:'une adresse historique'},
 {id:'s3',a:9.6,b:13.4,p:['entrecote',1],no:'N°03',t:'Viandes<br><b>de race</b>',scr:'maturées & tracées'},
 {id:'s4',a:13.4,b:17.8,p:['confit',1.5],no:'N°04',t:'<b>La carte</b>',menu:true},
 {id:'s5',a:17.8,b:21.4,p:['vins',1.5],no:'N°05',t:'Grands<br><b>vins</b>',scr:'à partager'},
 {id:'s6',a:21.4,b:25,p:['salle',1],no:'N°06',t:'Une ambiance<br><b>authentique</b>',scr:'inspirations brocantesques'},
 {id:'s7',a:25,b:28.2,p:['amis',1.5],no:'N°07',t:'<b>After work</b>',scr:'dès 17h30, du lundi au vendredi'},
 {id:'s8',a:28.2,b:31.2},
 {id:'s9',a:31.2,b:36}];
const MENU=[['Planche de charcuterie Label Rouge','19 €'],['Foie gras maison','17,50 €','la recette de ma grand-mère'],['Jolie entrecôte maturée 300 g','28 €','frites maison, sauce poivre qui tue'],["L'onglet Aberdeen IGP 220 g",'26 €'],['Moelleux chocolat Valrhona 66 %','9,50 €','cœur coulant bien sûr !']];
const root=Q('#scenes');
S.forEach(s=>{const e=document.createElement('section');e.className='sc';e.id=s.id;let h='';
 if(s.p)h+=`<div class="mat"><img src="${A}${s.p[0]}.jpg"></div>`;
 if(s.t)h+=`<div class="blk top"><div class="no">${s.no}</div><span class="rule"></span><div class="ttl">${s.t}</div></div>`;
 if(s.scr)h+=`<div class="blk bot"><div class="scr">${s.scr}</div></div>`;
 if(s.menu)h+=`<div class="blk bot menu">${MENU.map(m=>`<div class="mi"><span>${m[0]}${m[2]?`<small>${m[2]}</small>`:''}</span><span class="dots"></span><span class="pr">${m[1]}</span></div>`).join('')}</div>`;
 e.innerHTML=h;root.appendChild(e);});
Q('#kv').insertAdjacentHTML('beforeend',`<div class="blk top"><div class="no">SAINT-GERMAIN-EN-LAYE</div><span class="rule" style="width:30vw"></span><div class="ttl" style="font-size:calc(10*var(--u));white-space:nowrap"><b>LES FISTONS</b></div><div class="scr" style="font-size:calc(6*var(--u));margin-top:calc(1*var(--u))">le bistroquet</div></div>
 <div class="blk bot"><div class="ttl" style="font-size:calc(4*var(--u))">Viandes de race · <b>grands vins</b></div></div><div class="pill" id="kvp"><i>▶</i>DÉCOUVREZ LE FILM</div>`);
Q('#s8').innerHTML=`<div class="blk mid"><div class="no">RÉSERVATIONS</div><span class="rule"></span><div class="ttl"><b>LES FISTONS</b></div>
 <div class="info" style="margin-top:calc(3*var(--u))">22 place Charles de Gaulle<br>Saint-Germain-en-Laye</div><div class="info" style="font-size:calc(3.2*var(--u));opacity:.75;margin-top:calc(1*var(--u))">Ouvert 7j/7 · lun.–sam. 6h – 1h · dim. 6h – 23h</div>
 <div class="phone">01 39 73 06 34</div></div>`;
Q('#s9').innerHTML=`<div class="blk top"><div class="no">UNE PROPOSITION</div><span class="rule"></span><div class="ttl" style="font-size:calc(7.6*var(--u))">Et si ce film<br><b>était le vôtre ?</b></div><div class="scr" style="margin-top:calc(1.6*var(--u))">pensé pour Les Fistons</div></div>
 <div class="blk mid"><div class="logoCard"><img src="../edust_onboarding/assets/edust-solutions-logo.png"></div><div class="info" style="font-size:calc(3.2*var(--u));margin-top:calc(2.4*var(--u))">Films de marque · Reels · Motion design</div></div>
 <div class="blk bot"><div class="phone" style="font-size:calc(4*var(--u))">PARLONS-EN</div><div class="info" style="font-size:calc(2.8*var(--u));margin-top:calc(1.6*var(--u))">Tarik Belattar · tarikbelatta@gmail.com · 06 13 24 96 80</div></div>`;
['0','1','2','3'].forEach(i=>{const o=document.createElement('div');o.className='orn';Q('#stage').appendChild(o);o.dataset.i=i});
{const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');const d=g.createImageData(200,200);for(let i=0;i<d.data.length;i+=4){const v=hash(i*.37)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);Q('#grain').style.backgroundImage=`url(${c.toDataURL()})`}
const es=x=>x*x*(3-2*x);
function fadeIn(el,t,a,d=1.1,dy=1.5){if(!el)return;const p=es(seg(t,a,a+d));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy*U}px)`;el.style.filter=`blur(${(1-p)*5}px)`}
function render(t){
 measure();const vh=H/100,vw=W/100;
 // ornements aux coins du cadre
 document.querySelectorAll('.orn').forEach(o=>{const i=+o.dataset.i;o.style.left=`calc(${i%2?96.4:3.6}vw - ${1.2*U}px)`;o.style.top=`calc(${i<2?2.4:97.6}vh - ${1.2*U}px)`});
 let cur=0;S.forEach((s,k)=>{if(t>=s.a)cur=k});
 // passage au noir lent entre deux scènes + filet crème qui balaie
 let bl=0,swp=-1;for(let k=1;k<S.length;k++){const a=S[k].a;const d=Math.abs(t-a);if(d<.55)bl=Math.max(bl,1-d/.55);if(t>a-.55&&t<a+.55)swp=seg(t,a-.55,a+.55)}
 Q('#black').style.opacity=bl*.92;const sw=Q('#sweep');if(swp>=0){sw.style.opacity=Math.sin(swp*Math.PI);sw.style.top=(20+swp*60)+'vh';sw.style.width='100vw'}else sw.style.opacity=0;
 S.forEach((s,k)=>{const e=Q('#'+s.id);e.style.opacity=k==cur?1:0;if(k!=cur)return;const lt=t-s.a,ph=seg(t,s.a,s.b);
  const m=e.querySelector('.mat');
  if(m){const r=s.p[1];let w=r>=1.4?(R45?70:90):(R45?54:80);if(s.menu)w=R45?52:76;m.style.width=w+'vw';
   const cy=s.id=='kv'?(R45?2:1):s.menu?(R45?-14:-15):(R45?0:-1);
   m.style.transform=`translate(-50%,-50%) translateY(${cy*vh}px) scale(${.96+.06*ph}) rotate(${Math.sin(lt*.3)*.4}deg)`;
   m.style.opacity=s.id=='kv'?1:es(seg(t,s.a+.1,s.a+1.2));}
  const tp=e.querySelector('.blk.top'),bt=e.querySelector('.blk.bot'),md=e.querySelector('.blk.mid');
  if(tp)tp.style.top=(s.id=='kv'?(R45?6:7):s.id=='s9'?(R45?7:9):(R45?5.5:7))+'vh';
  if(bt)bt.style.top=(s.id=='kv'?(R45?76:77):s.menu?(R45?52:52):s.id=='s9'?(R45?76:78):(R45?77:74))+'vh';
  if(md)md.style.top=(s.id=='s9'?(R45?40:44):(R45?20:26))+'vh';
  if(s.id=='kv'){e.querySelectorAll('.rule').forEach(r=>r.style.width='30vw');return}
  if(tp){fadeIn(tp.querySelector('.no'),t,s.a+.2,.8);const r=tp.querySelector('.rule');if(r)r.style.width=(es(seg(t,s.a+.4,s.a+1.4))*30)+'vw';fadeIn(tp.querySelector('.ttl'),t,s.a+.6);const sc=tp.querySelector('.scr');if(sc)fadeIn(sc,t,s.a+1.4)}
  if(md){fadeIn(md,t,s.a+.4);const r=md.querySelector('.rule');if(r)r.style.width=(es(seg(t,s.a+.6,s.a+1.6))*30)+'vw'}
  if(bt&&!s.menu)fadeIn(bt,t,s.a+1.3,1.2);
  if(s.menu){bt.style.opacity=1;bt.querySelectorAll('.mi').forEach((x,i)=>{const a=s.a+1.0+i*.55;const p=es(seg(t,a,a+.7));x.style.opacity=p;x.style.transform=`translateX(${(1-p)*-3*U}px)`;
    const d=x.querySelector('.dots');d.style.clipPath=`inset(0 ${100-100*es(seg(t,a+.2,a+.9))}% 0 0)`})}
 });
 const kp=Q('#kvp');kp.style.top=(R45?86:86)+'vh';kp.style.transform=`translateX(-50%) scale(${1+.025*Math.sin(t*4)})`;
}
window.render=render;
</script></body></html>
