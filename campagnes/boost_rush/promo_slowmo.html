<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>BOOST RUSH — slow motion</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Montserrat:wght@300;500;800&family=Lexend+Deca:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E3171B;--u:min(1vw,.7vh);--ch:62vh}
body.r45{--ch:58vh}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;color:#fff;font-family:'Lexend Deca',sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(60% 45% at 50% 50%,#1a0405,#000 70%)}
#world{position:absolute;inset:0;transform-origin:0 0}
.cv{position:absolute;inset:0;width:100%;height:100%}
#beam{position:absolute;left:50%;top:-20%;width:90vw;height:110%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,60,50,.22),rgba(255,40,40,.06) 55%,transparent 80%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);mix-blend-mode:screen;filter:blur(2vh)}
#haze1,#haze2{position:absolute;border-radius:50%;filter:blur(6vh);mix-blend-mode:screen}
#haze1{width:120vw;height:40vh;background:radial-gradient(closest-side,rgba(227,23,27,.22),transparent)}
#haze2{width:90vw;height:30vh;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent)}
#canw{position:absolute;left:50%;top:50%;height:var(--ch);aspect-ratio:1216/3004}
#can{position:absolute;inset:0}
#can img{position:absolute;inset:0;width:100%;height:100%}
#sheen{position:absolute;inset:0;-webkit-mask-image:url(assets/canette_nue.png);-webkit-mask-size:100% 100%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.32) 48%,rgba(255,255,255,.06) 54%,transparent 60%);background-size:300% 100%;background-repeat:no-repeat}
#rim{position:absolute;inset:0;-webkit-mask-image:url(assets/canette_nue.png);-webkit-mask-size:100% 100%;background:linear-gradient(90deg,rgba(255,40,40,.75),transparent 16%,transparent 84%,rgba(255,40,40,.75));mix-blend-mode:screen}
#glow{position:absolute;left:50%;top:50%;width:300%;height:90%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(227,23,27,.45),rgba(227,23,27,.12) 55%,transparent)}
/* textes (écran) */
.L{position:absolute;opacity:0;z-index:20}
.cap{left:0;right:0;text-align:center;font-family:Montserrat;font-weight:300;font-size:calc(5*var(--u));letter-spacing:.5em;text-transform:uppercase;padding-left:.5em}
.cap b{font-weight:800}
.cap,#fuel{text-shadow:0 0 calc(2.5*var(--u)) #000,0 0 calc(1*var(--u)) #000,0 0 calc(5*var(--u)) rgba(0,0,0,.9)}
#sauf{left:0;right:0;text-align:center;font-family:Anton;font-size:calc(24*var(--u));line-height:.9;color:var(--red);text-shadow:0 0 calc(6*var(--u)) rgba(227,23,27,.6)}
#fuel{left:0;right:0;text-align:center;font-family:Montserrat;font-weight:800;font-size:calc(5.6*var(--u));letter-spacing:.42em;padding-left:.42em}
#fuel span{display:inline-block}
#kick{left:0;right:0;text-align:center;font-family:Montserrat;font-weight:500;font-size:calc(2.6*var(--u));letter-spacing:.55em;color:#ff5a55;padding-left:.55em}
#tag{left:0;right:0;text-align:center;font-family:'Permanent Marker';font-size:calc(8*var(--u));text-transform:uppercase;text-shadow:0 calc(.6*var(--u)) calc(3*var(--u)) #000}
#tag em{font-style:normal;color:var(--red)}
#hook{left:0;right:0;text-align:center;font-family:Anton;font-size:calc(12*var(--u));line-height:.95;text-shadow:0 calc(.8*var(--u)) calc(4*var(--u)) #000}
#hook em{font-style:normal;color:var(--red);text-shadow:0 0 calc(5*var(--u)) rgba(227,23,27,.8)}
#play{left:50%;display:flex;align-items:center;gap:calc(1.6*var(--u));font-family:Montserrat;font-weight:800;font-size:calc(3.2*var(--u));letter-spacing:.2em;background:rgba(0,0,0,.55);border:calc(.35*var(--u)) solid rgba(255,255,255,.8);border-radius:999px;padding:calc(1.2*var(--u)) calc(3.4*var(--u)) calc(1.2*var(--u)) calc(1.4*var(--u));white-space:nowrap}
#play i{font-style:normal;width:calc(6*var(--u));height:calc(6*var(--u));border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:calc(2.6*var(--u));padding-left:.15em;box-shadow:0 0 calc(3*var(--u)) rgba(227,23,27,.9)}
#badge{width:calc(16*var(--u));height:calc(16*var(--u));border-radius:50%;border:calc(.4*var(--u)) solid rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Anton;font-size:calc(5*var(--u));line-height:.9;backdrop-filter:blur(4px);background:rgba(255,255,255,.06)}
#badge small{font-family:Montserrat;font-weight:800;font-size:calc(1.8*var(--u));letter-spacing:.3em}
#cta{left:50%;background:var(--red);font-family:Anton;font-size:calc(5.6*var(--u));letter-spacing:.06em;padding:calc(1.6*var(--u)) calc(5.6*var(--u));border-radius:999px;white-space:nowrap;box-shadow:0 0 0 calc(.5*var(--u)) #fff,0 0 calc(6*var(--u)) rgba(227,23,27,.9)}
#web{left:0;right:0;text-align:center;font-family:Montserrat;font-weight:500;font-size:calc(2.3*var(--u));letter-spacing:.3em;opacity:.8}
#legal{left:5vw;right:5vw;bottom:1.8vh;text-align:center;font-size:calc(1.8*var(--u));line-height:1.35;color:rgba(255,255,255,.7)}
#bars i{position:absolute;left:0;right:0;height:0;background:#000;z-index:18}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
#vig{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.75));z-index:17;pointer-events:none}
#grain{position:absolute;inset:0;z-index:19;opacity:.07;pointer-events:none;background-size:200px 200px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30}
</style></head><body>
<div id="stage">
 <div id="haze1"></div><div id="haze2"></div><div id="beam"></div>
 <div id="world">
  <canvas class="cv" id="back"></canvas>
  <div id="canw"><div id="glow"></div><div id="can"><img src="assets/canette_complete.png"><img id="drops" src="assets/gouttes.png"><div id="rim"></div><div id="sheen"></div></div></div>
  <canvas class="cv" id="front"></canvas>
 </div>
 <div id="vig"></div>
 <div id="bars"><i></i><i></i></div>
 <div class="L cap" id="c1">Tout <b>ralentit</b>…</div>
 <div class="L cap" id="c2">Chaque <b>goutte</b>.</div>
 <div class="L cap" id="c3">Chaque <b>seconde</b>.</div>
 <div class="L" id="sauf">SAUF<br>TOI.</div>
 <div class="L" id="fuel"></div>
 <div class="L" id="kick">BOISSON ÉNERGISANTE</div>
 <div class="L" id="hook">TU VAS AVOIR <em>SOIF.</em></div>
 <div class="L" id="play"><i>▶</i>REGARDE AU RALENTI</div>
 <div class="L" id="badge"><span>500</span><small>ML</small></div>
 <div class="L" id="tag">RÉVEILLE <em>LE TIGRE.</em></div>
 <div class="L" id="cta">PRENDS TA CANETTE ⚡</div>
 <div class="L" id="web">SITE WEB · À COMPLÉTER</div>
 <div class="L" id="legal">Teneur élevée en caféine. Déconseillé aux enfants et aux femmes enceintes ou allaitantes.<br>Visuel conceptuel.</div>
 <div id="grain"></div>
 <div id="flash"></div>
</div>
<script>
const DUR=20;
const Q=s=>document.querySelector(s);
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),mix=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,es=x=>x*x*(3-2*x);
const eb=x=>{const c1=2.2,c3=c1+1;return x<=0?0:x>=1?1:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
let U=10,W=0,H=0,R45=false;
// grain
{const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');const d=g.createImageData(200,200);for(let i=0;i<d.data.length;i+=4){const v=hash(i*.37)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);Q('#grain').style.backgroundImage=`url(${c.toDataURL()})`}
Q('#fuel').innerHTML='FUEL YOUR LIMITS'.split('').map(c=>`<span>${c==' '?'&nbsp;':c}</span>`).join('');

// ---------- temps « simulé » : ralenti permanent, accélération brutale vers 9 s ----------
function speed(t){if(t<2)return .1;let s=.2;const r=Math.exp(-Math.pow((t-9.25)/.22,2));return s+4.2*r}
const TAU=[0];const DT=1/240;for(let i=1;i<=DUR/DT+2;i++){TAU.push(TAU[i-1]+speed((i-.5)*DT)*DT)}
const tau=t=>{const x=t/DT,i=Math.floor(x),f=x-i;return mix(TAU[Math.min(i,TAU.length-1)],TAU[Math.min(i+1,TAU.length-1)],f)};

// ---------- caméra : [t, échelle, décalage vertical (fraction de hauteur de canette), rotation] ----------
const CAM=[[0,1,0,0],[1.9,1,0,0],[3.2,2.5,-.2,5],[6.2,2.5,.08,2],[8.9,2.3,.18,-2],[9.55,1,0,0],[15.2,.96,0,0],[16.2,.88,.04,0],[20,.9,.04,0]];
function cam(t){for(let i=0;i<CAM.length-1;i++){const a=CAM[i],b=CAM[i+1];if(t>=a[0]&&t<=b[0]){const p=(i==4)?eio(seg(t,a[0],b[0])):es(seg(t,a[0],b[0]));return[mix(a[1],b[1],p),mix(a[2],b[2],p),mix(a[3],b[3],p)]}}return CAM[CAM.length-1].slice(1)}

// ---------- particules ----------
const ICE=[...Array(8)].map((_,i)=>({a0:i/8*Math.PI*2+hash(i)*.4,y:(hash(i+3)-.5)*.9,r:.95+hash(i+5)*.5,s:.13+hash(i+7)*.07,rot:hash(i+9)*6,vr:(hash(i+11)-.5)*.8}));
const DROP=[...Array(90)].map((_,i)=>({a:hash(i+20)*Math.PI*2,y:(hash(i+21)-.5)*1.1,v:.12+hash(i+22)*.35,z:hash(i+23)*2-1,s:.5+hash(i+24)*1.6,ph:hash(i+25)*10}));
const EMB=[...Array(40)].map((_,i)=>({x:hash(i+60),y:hash(i+61),v:.02+hash(i+62)*.05,s:.4+hash(i+63)}));
function iceCubeRaw(g,x,y,sz,rot,blur,tint){
 g.save();g.translate(x,y);g.rotate(rot);if(blur>0)g.filter=`blur(${blur}px)`;
 const r=sz*.22;g.beginPath();g.roundRect(-sz/2,-sz/2,sz,sz,r);
 const gr=g.createLinearGradient(-sz/2,-sz/2,sz/2,sz/2);gr.addColorStop(0,'rgba(230,245,255,.38)');gr.addColorStop(.5,`rgba(255,${120+tint},${120+tint},.14)`);gr.addColorStop(1,'rgba(200,225,255,.30)');
 g.fillStyle=gr;g.fill();g.lineWidth=sz*.035;g.strokeStyle='rgba(255,255,255,.55)';g.stroke();
 g.beginPath();g.roundRect(-sz*.32,-sz*.32,sz*.64,sz*.64,r*.7);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=sz*.05;g.stroke();
 g.beginPath();g.ellipse(-sz*.18,-sz*.22,sz*.16,sz*.06,-.6,0,7);g.fillStyle='rgba(255,255,255,.7)';g.fill();
 g.beginPath();g.ellipse(sz*.3,sz*.25,sz*.08,sz*.035,-.6,0,7);g.fillStyle='rgba(255,90,80,.5)';g.fill();
 g.restore();}
function dropletRaw(g,x,y,r,blur,al){g.save();if(blur>0)g.filter=`blur(${blur}px)`;g.globalAlpha=al;
 const gr=g.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.35,'rgba(210,225,240,.35)');gr.addColorStop(1,'rgba(255,60,50,.25)');
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
// sprites précalculés : on dessine une fois chaque niveau de flou, puis on les recopie (rapide)
const BL=[0,.06,.14,.26];const ICE_SP=[],DROP_SP=[];
for(const b of BL){const c=document.createElement('canvas');c.width=c.height=320;iceCubeRaw(c.getContext('2d'),160,160,200,0,b*200,0);ICE_SP.push(c);
 const d=document.createElement('canvas');d.width=d.height=128;dropletRaw(d.getContext('2d'),64,64,40,b*40,1);DROP_SP.push(d);}
const lvl=f=>f<=.02?0:f<.1?1:f<.2?2:3;
function iceCube(g,x,y,sz,rot,blur,tint){const sp=ICE_SP[lvl(blur/sz)];const k=sz/200;g.save();g.translate(x,y);g.rotate(rot);g.drawImage(sp,-160*k,-160*k,320*k,320*k);g.restore();}
function droplet(g,x,y,r,blur,al){if(al<=0||r<=0)return;const sp=DROP_SP[lvl(blur/(r*2))];const k=r/40;g.save();g.globalAlpha=al;g.drawImage(sp,x-64*k,y-64*k,128*k,128*k);g.restore();}
function drawParticles(t){
 const T=tau(t);const bk=Q('#back').getContext('2d'),fr=Q('#front').getContext('2d');
 for(const c of [Q('#back'),Q('#front')]){if(c.width!==W){c.width=W;c.height=H}}
 bk.clearRect(0,0,W,H);fr.clearRect(0,0,W,H);
 const ch=H*parseFloat(getComputedStyle(document.body).getPropertyValue('--ch'))/100||H*.62;
 const cx=W/2,cy=H/2,R=ch*.42;
 const ramp=Math.exp(-Math.pow((t-9.25)/.25,2));
 // anneaux d'énergie (après l'accélération)
 const rg=seg(t,9.5,10.5)*(1-seg(t,15,16));
 for(let k=0;k<3;k++){const ph=((T*.35+k/3)%1);const ry=ch*(-.3+ph*.75),rx=R*1.25*(1+.1*Math.sin(T+k)),al=rg*Math.sin(ph*Math.PI)*.85;if(al<=0)continue;
  for(const[g,a0,a1] of [[bk,Math.PI,2*Math.PI],[fr,0,Math.PI]]){g.save();g.strokeStyle=`rgba(255,50,40,${al})`;g.lineWidth=U*.5;g.shadowColor='rgba(255,40,40,.9)';g.shadowBlur=U*3;
   g.beginPath();g.ellipse(cx,cy+ry,rx,rx*.16,0,a0,a1);g.stroke();g.restore();}}
 // glaçons en orbite (profondeur : derrière / devant)
 ICE.forEach((c,i)=>{const a=c.a0+T*c.s*2;const z=Math.sin(a);const x=cx+Math.cos(a)*R*c.r*1.45,y=cy+c.y*ch*.8+Math.sin(T*.6+i)*U*1.2;
  const sz=U*(10+6*hash(i))*(1+.35*z);const g=z<0?bk:fr;const blur=Math.abs(z)>.55?(z>0?U*.45*(z-.55)/.45*3:U*.25):0;
  const sx=ramp*U*6;if(sx>1){g.save();g.globalAlpha=.25;for(let k=1;k<5;k++)iceCube(g,x,y-sx*k*.6,sz,c.rot+T*c.vr,blur+2,30);g.restore();}
  iceCube(g,x,y,sz,c.rot+T*c.vr,blur,30*(z<0?1:0));});
 // gouttes qui volent lentement (cycle)
 DROP.forEach((d,i)=>{const life=((T*d.v+d.ph)%1);const dist=R*(.6+life*1.8);const x=cx+Math.cos(d.a)*dist,y=cy+d.y*ch*.7+Math.sin(d.a)*dist*.35+life*life*ch*.15;
  const r=U*.45*d.s*(1+.5*d.z);const g=d.z<0?bk:fr;const blur=d.z>.6?U*.35*(d.z-.6)*6:d.z<-.6?U*.2:0;const al=Math.sin(life*Math.PI);
  if(ramp>.05){g.save();g.strokeStyle=`rgba(255,255,255,${.4*al*ramp})`;g.lineWidth=r;g.beginPath();g.moveTo(x,y);g.lineTo(x-Math.cos(d.a)*U*14*ramp,y-Math.sin(d.a)*U*5*ramp);g.stroke();g.restore();}
  droplet(g,x,y,r,blur,al);});
 // gouttes qui glissent sur la canette (devant)
 const cwid=ch*1216/3004;
 for(let i=0;i<9;i++){const x=cx+(hash(i+80)-.5)*cwid*.7,y0=cy-ch*.38+hash(i+81)*ch*.3,len=ch*.5;const p=((T*(.08+hash(i+82)*.1)+hash(i+83))%1);
  const y=y0+p*len;const r=U*(.35+hash(i+84)*.35);
  fr.save();fr.strokeStyle='rgba(255,255,255,.18)';fr.lineWidth=r*.8;fr.beginPath();fr.moveTo(x,y0);fr.lineTo(x,y);fr.stroke();fr.restore();droplet(fr,x,y,r,0,.9);}
 // braises
 EMB.forEach((e,i)=>{const y=H-((T*e.v*H*2+e.y*H*1.3)%(H*1.3));const x=e.x*W+Math.sin(T*2+i)*U*2;
  fr.fillStyle=`rgba(255,${70+Math.floor(hash(i)*90)},50,${.35+.4*Math.sin(T*3+i)})`;fr.beginPath();fr.arc(x,y,U*.22*e.s,0,7);fr.fill();});
}
function set(el,o,tr){el.style.opacity=o;if(tr!==undefined)el.style.transform=tr}
function render(t){
 W=innerWidth;H=innerHeight;U=Math.min(W/100,H*.7/100);const vh=H/100;
 const T=tau(t);
 // caméra
 const [s,fy,rot]=cam(t);const ch=H*(R45?.58:.62);
 const shk=Math.exp(-Math.pow((t-9.25)/.12,2))*U*1.5;
 Q('#world').style.transform=`translate(${W/2+(hash(Math.floor(t*30))-.5)*shk}px,${H/2}px) rotate(${rot}deg) scale(${s}) translate(${-W/2}px,${-H/2-fy*ch}px)`;
 // canette : flottement lent
 const fl=Math.sin(T*1.4)*1.2;
 Q('#canw').style.transform=`translate(-50%,-50%) translateY(${fl*vh}px) rotate(${Math.sin(T*.8)*2.5-(t<2||t>15.5?6:0)}deg)`;
 // reflet : lent, puis balayage rapide pendant l'accélération (= rotation)
 const sp=((T*.45)%1.6)/1.6;Q('#sheen').style.backgroundPosition=`${(1-sp)*180-40}% 0`;
 Q('#rim').style.opacity=.6+.4*Math.sin(T*2);
 Q('#beam').style.opacity=.7+.3*Math.sin(t*1.3);
 Q('#haze1').style.transform=`translate(${-10+Math.sin(t*.2)*8}vw,${55+Math.sin(t*.3)*4}vh)`;Q('#haze2').style.transform=`translate(${20-Math.sin(t*.25)*10}vw,${20+Math.cos(t*.2)*5}vh)`;
 Q('#flash').style.opacity=Math.max(Math.exp(-Math.pow((t-9.45)/.07,2))*.9,t>=15.2?Math.exp(-(t-15.2)*8)*.25:0);
 // bandes cinéma pendant le ralenti
 const lb=(es(seg(t,1.9,2.6))-es(seg(t,14.8,15.5)))*(R45?6:8);document.querySelectorAll('#bars i').forEach(e=>e.style.height=lb+'vh');
 drawParticles(t);
 // ---- légendes au ralenti ----
 [['#c1',2.7,4.6],['#c2',4.9,6.8],['#c3',7.0,8.9]].forEach(([q,a,b])=>{const e=Q(q);e.style.top=(R45?82:84)+'vh';const p=es(seg(t,a,a+.9));const o=Math.min(p,1-seg(t,b-.4,b));
  set(e,o,`translateY(${(1-p)*2*U}px)`);e.style.letterSpacing=(.35+.2*seg(t,a,b))+'em';e.style.filter=`blur(${(1-p)*6}px)`;});
 const sf=Q('#sauf');sf.style.top=(R45?9:11)+'vh';const sp2=seg(t,9.7,10.25);set(sf,t>=9.7?cl(sp2*3)*(1-seg(t,12,12.4)):0,`scale(${1.8-.8*eo(sp2)})`);
 const fu=Q('#fuel');fu.style.top=(R45?84:83)+'vh';fu.style.opacity=t>=12.2&&t<15.4?1-seg(t,15,15.4):0;
 fu.querySelectorAll('span').forEach((e,i)=>{const p=es(seg(t,12.3+i*.12,12.9+i*.12));e.style.opacity=p;e.style.filter=`blur(${(1-p)*8}px)`;e.style.transform=`translateY(${(1-p)*-2*U}px)`});
 // ---- miniature (0 -> 2 s) et packshot (15,5 s -> fin) ----
 const kv=t<2?1-seg(t,1.75,2):0,pk=seg(t,15.6,16.2);
 const kk=Q('#kick');kk.style.top=(R45?4:5)+'vh';set(kk,Math.max(kv,pk));
 const bd=Q('#badge');bd.style.left=(R45?73:71)+'vw';bd.style.top=(R45?28:28)+'vh';set(bd,Math.max(kv,seg(t,16.2,16.7)),`rotate(-10deg) scale(${t>=15?.8+.2*eb(seg(t,16.2,16.7)):1})`);
 const hk=Q('#hook');hk.style.top=(R45?9:10)+'vh';set(hk,kv,`scale(${1+.02*Math.sin(t*3)})`);
 const pl=Q('#play');pl.style.top=(R45?84:85)+'vh';set(pl,kv,`translateX(-50%) scale(${1+.03*Math.sin(t*5)})`);
