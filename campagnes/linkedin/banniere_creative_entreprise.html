<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Bannière page entreprise créative — E-DUST Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* 1584x396 ; la photo de profil couvre le coin bas gauche (~0-420 px) : rien d'important à cet endroit */
*{box-sizing:border-box;margin:0;padding:0}
body{width:1128px;height:191px;overflow:hidden;font-family:Inter,sans-serif;background:#07080f;color:#fff;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.b1{width:360px;height:360px;left:60px;top:-200px;background:#1f5bff}
.b2{width:300px;height:300px;left:700px;top:60px;background:#ff2d87}
.b3{width:260px;height:260px;left:900px;top:-160px;background:#ff8a00}
.b4{width:220px;height:220px;left:420px;top:120px;background:#00d4ff;opacity:.45}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:4px 4px;mix-blend-mode:overlay}
/* mot géant en contour */
.huge{position:absolute;left:120px;top:-30px;font-weight:900;font-size:180px;letter-spacing:-.04em;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.08);white-space:nowrap}
/* texte */
.txt{position:absolute;left:36px;top:22px;width:560px;z-index:5}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.2em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
.rec i{width:10px;height:10px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 12px #ff3b3b}
h1{font-size:38px;line-height:.98;font-weight:900;letter-spacing:-.02em;margin:8px 0 6px}
h1 .g{background:linear-gradient(90deg,#00d4ff,#7b61ff 45%,#ff2d87 75%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hand{font-family:Caveat;font-size:20px;color:#ffd166;transform:rotate(-3deg);display:inline-block;margin-left:6px}
.s{font-size:12px;font-weight:500;color:#c8cfdd;line-height:1.4}
/* timeline de montage */
.tl{display:none;z-index:4}
.tl .rul{position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 22px)}
.tl .tr{position:absolute;left:0;right:0;top:16px;height:26px;display:flex;gap:4px}
.tl .tr b{display:block;height:100%;border-radius:6px;opacity:.9}
.tl .ph{position:absolute;top:-6px;bottom:-4px;left:41%;width:2px;background:#fff;box-shadow:0 0 10px #fff}
.tl .ph:before{content:'';position:absolute;left:-7px;top:-8px;border:8px solid transparent;border-top:10px solid #fff}
/* téléphones en éventail */
.fan{position:absolute;left:690px;top:-8px;width:460px;height:380px;z-index:6;transform:scale(.62);transform-origin:0 0}
.p{position:absolute;width:132px;height:236px;border-radius:20px;overflow:hidden;border:4px solid #fff;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.p1{left:0;top:70px;transform:rotate(-16deg)}
.p2{left:100px;top:22px;transform:rotate(-5deg);z-index:2}
.p3{left:205px;top:30px;transform:rotate(6deg);z-index:3}
.p4{left:305px;top:80px;transform:rotate(16deg)}
.play{position:absolute;left:186px;top:118px;width:78px;height:78px;border-radius:50%;background:#fff;z-index:5;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(255,255,255,.18),0 0 40px rgba(255,45,135,.7)}
.play:after{content:'';margin-left:7px;border:17px solid transparent;border-left:27px solid #ff2d87;border-right:0}
/* stickers */
.st{position:absolute;z-index:7;font-weight:900;font-size:15px;letter-spacing:.04em;padding:8px 14px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.s1{left:640px;top:16px;font-size:11px!important;background:#ffd166;color:#111;transform:rotate(-10deg)}
.s2{left:990px;top:140px;font-size:11px!important;background:#00d4ff;color:#071018;transform:rotate(8deg)}
.s3{left:640px;top:140px;font-size:11px!important;background:#ff2d87;color:#fff;transform:rotate(-6deg)}
.heart{position:absolute;z-index:7;font-size:30px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.arrow{display:none;width:190px;height:80px;z-index:5}
.url{position:absolute;right:18px;top:10px;font-size:10px!important;z-index:8;font-size:13px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.05em}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div class="huge">PLAY ▶</div>
<div class="grain"></div>

<div class="txt">
 <span class="rec"><i></i>MOTION DESIGN · UGC · REELS</span>
 <h1>Des vidéos qui<br><span class="g">donnent envie.</span></h1>
 <div class="s">Vos photos deviennent des vidéos qui arrêtent le scroll.<span class="hand">sans tournage !</span></div>
</div>

<svg class="arrow" viewBox="0 0 190 80" fill="none"><path d="M6 60 C 60 10, 120 8, 170 40" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M158 26 L172 41 L152 46" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div class="tl"><div class="rul"></div>
 <div class="tr"><b style="flex:2.2;background:#1f5bff"></b><b style="flex:1.2;background:#7b61ff"></b><b style="flex:3;background:#ff2d87"></b><b style="flex:1.6;background:#ff8a00"></b><b style="flex:2.4;background:#00d4ff"></b><b style="flex:1;background:#ffd166"></b></div>
 <div class="ph"></div></div>

<div class="fan">
 <div class="p p1"><img src="../../livraison/portfolio_site/videos/pov-mariage.jpg"></div>
 <div class="p p2"><img src="../../livraison/portfolio_site/videos/pov-patisserie.jpg"></div>
 <div class="p p3"><img src="../../livraison/portfolio_site/videos/pub-canette-ralenti.jpg"></div>
 <div class="p p4"><img src="../../livraison/portfolio_site/videos/ugc-conversation-brasserie-rouge.jpg"></div>
 <div class="play"></div>
</div>
<div class="st s1">POV 👀</div>
<div class="st s3">SLOW-MO</div>
<div class="st s2">+12,4 k ❤️</div>
<div class="url">EDUST-SOLUTIONS.FR</div>
</body></html>
